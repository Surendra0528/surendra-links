<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Connect with Surendra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Google Font (optional) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #1e1e2f 0, #050509 55%, #000000 100%);
      color: #f8f8ff;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 24px 22px 26px;
      border-radius: 20px;
      background: rgba(10, 10, 20, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
      text-align: center;
      backdrop-filter: blur(18px);
    }

    .badge {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      opacity: 0.9;
      margin-bottom: 12px;
    }

    .avatar {
      width: 78px;
      height: 78px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      font-size: 34px;
      font-weight: 600;
      background: radial-gradient(circle at 30% 0%, #6366f1, #111118);
    }

    .name {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #c7c7ff;
      margin-bottom: 18px;
    }

    .pill {
      display: inline-block;
      font-size: 0.75rem;
      padding: 3px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      opacity: 0.9;
      margin-bottom: 16px;
    }

    .buttons {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      border-radius: 999px;
      text-decoration: none;
      color: #f8f8ff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
      backdrop-filter: blur(16px);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      font-size: 0.9rem;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .btn-left {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .icon-circle {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      background: rgba(0, 0, 0, 0.18);
    }

    .btn-label {
      line-height: 1.2;
    }

    .btn-label strong {
      display: block;
      font-size: 0.9rem;
    }

    .btn-label span {
      display: block;
      font-size: 0.75rem;
      opacity: 0.75;
    }

    .btn-wa .icon-circle {
      background: radial-gradient(circle, #25d366, #075e54);
    }

    .btn-ig .icon-circle {
      background: radial-gradient(circle at 30% 0%, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
    }

    .btn-fb .icon-circle {
      background: linear-gradient(135deg, #1877f2, #0f4fb3);
    }

    .footer-note {
      margin-top: 16px;
      font-size: 0.7rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Digital Profile</div>

    <div class="avatar">S</div>

    <div class="name">G.M.Surendra Dora</div>
    <div class="subtitle">Tap a platform below to connect with me</div>

    <div class="pill">WhatsApp · Instagram · Facebook</div>

    <div class="buttons">
      <!-- WhatsApp -->
      <a
        class="btn btn-wa"
        href="https://wa.me/qr/W7LAC5HBTTJWB1"
        target="_blank"
        rel="noopener noreferrer"
      >
        <div class="btn-left">
          <div class="icon-circle">💬</div>
          <div class="btn-label">
            <strong>WhatsApp</strong>
            <span>Chat with me instantly</span>
          </div>
        </div>
      </a>

      <!-- Instagram -->
      <a
        class="btn btn-ig"
        href="https://www.instagram.com/surendra__shield?igsh=MWZlZGRiaXMwcmVpNQ=="
        target="_blank"
        rel="noopener noreferrer"
      >
        <div class="btn-left">
          <div class="icon-circle">📸</div>
          <div class="btn-label">
            <strong>Instagram</strong>
            <span>Follow my journey</span>
          </div>
        </div>
      </a>

      <!-- Facebook -->
      <a
        class="btn btn-fb"
        href="https://www.facebook.com/share/1CnKqtASEH/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <div class="btn-left">
          <div class="icon-circle">👍</div>
          <div class="btn-label">
            <strong>Facebook</strong>
            <span>Connect on Facebook</span>
          </div>
        </div>
      </a>
    </div>

    <div class="footer-note">
      Scan my QR → choose your favourite platform 🙂
    </div>
  </main>
</body>
</html>
